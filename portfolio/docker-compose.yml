version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: portfolio_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - portfolio_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: portfolio_server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/portfolio
      - JWT_SECRET=super_secret_key_change_me_in_prod
      - JWT_REFRESH_SECRET=another_super_secret_key_change_me_in_prod
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - portfolio_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: portfolio_client
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - portfolio_network

volumes:
  mongo_data:

networks:
  portfolio_network:
    driver: bridge
